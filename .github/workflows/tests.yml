# Os testes do pacote serialize_db no Ubuntu e no Windows: tests/ sem tests/proof_of_concept/ e
# sem tests/test_probes.py, sobre o DuckDB em memória e arquivos locais, sem S3 nem Redshift. As
# provas de conceito, os exemplos e os probes ficam fora. Antes dos testes, o pacote é instalado sem
# o grupo dev e cada módulo dele é importado, porque um projeto cliente recebe só as dependências de
# execução. As extensões delta e httpfs do DuckDB, a delta que a biblioteca carrega em toda conexão
# e a httpfs que os testes do secret do S3 carregam, são instaladas em .duckdb/ na raiz do
# repositório, a pasta que os testes procuram.
# Com o grupo dev instalado, o Ruff confere o código (ruff check) e a formatação
# (ruff format --check) antes dos testes. Os passos rodam no bash nos dois sistemas; no Windows, o
# Git Bash do runner.
name: Testes do pacote

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SERIALIZE_DB_TEST_LOCAL_ROOT: ${{ github.workspace }}/.pytest-local-root

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"

      - name: Instalar o pacote só com as dependências de execução
        run: uv sync --no-dev

      - name: Importar cada módulo do pacote sem o grupo dev
        run: |
          uv run --no-dev python - <<'EOF'
          import importlib
          import pkgutil

          import serialize_db

          for module in pkgutil.walk_packages(serialize_db.__path__, "serialize_db."):
              importlib.import_module(module.name)
          EOF
          uv run --no-dev serialize-db --help > /dev/null

      - name: Instalar o pacote e as dependências de teste
        run: uv sync

      - name: Conferir o código e a formatação com o Ruff
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Instalar as extensões delta e httpfs do DuckDB em .duckdb/
        run: >-
          uv run python -c
          "import duckdb; duckdb.connect(config={'extension_directory': '.duckdb'}).execute('INSTALL delta').execute('INSTALL httpfs')"

      - name: Preparar a raiz local dos testes que gravam arquivos
        run: mkdir -p "$SERIALIZE_DB_TEST_LOCAL_ROOT"

      - name: Rodar os testes do pacote
        run: >-
          uv run pytest tests
          --ignore=tests/proof_of_concept
          --ignore=tests/test_probes.py
          -p no:cacheprovider
