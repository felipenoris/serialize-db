# Os testes do pacote serialize_db: tests/ sem tests/proof_of_concept/ e sem tests/test_probes.py,
# sobre o DuckDB em memória e arquivos locais, sem S3 nem Redshift. As provas de conceito, os
# exemplos e os probes ficam fora. As extensões delta e httpfs do DuckDB, que os testes da migração
# leem pelo delta_scan e os do secret do S3 carregam, são instaladas em .duckdb/ na raiz do
# repositório, a pasta que os testes procuram.
name: Testes do pacote

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SERIALIZE_DB_TEST_LOCAL_ROOT: ${{ github.workspace }}/.pytest-local-root

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"

      - name: Instalar o pacote e as dependências de teste
        run: uv sync --group dev

      - name: Instalar as extensões delta e httpfs do DuckDB em .duckdb/
        run: >-
          uv run python -c
          "import duckdb; duckdb.connect(config={'extension_directory': '.duckdb'}).execute('INSTALL delta').execute('INSTALL httpfs')"

      - name: Preparar a raiz local dos testes que gravam arquivos
        run: mkdir -p "$SERIALIZE_DB_TEST_LOCAL_ROOT"

      - name: Rodar os testes do pacote
        run: >-
          uv run pytest tests
          --ignore=tests/proof_of_concept
          --ignore=tests/test_probes.py
          -p no:cacheprovider
