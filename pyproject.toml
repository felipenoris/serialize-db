[project]
name = "serialize-db"
version = "0.1.0"
description = "Banco analítico em tabelas Delta Lake, com DuckDB e Redshift como motores e o Redshift como destino de publicação"
readme = "README.md"
authors = [
    { name = "Felipe Noronha", email = "felipenoris@gmail.com" }
]
requires-python = ">=3.13"
# As dependências de execução, nas versões fixadas pelos documentos e pelas suítes de estudo. Os
# dialetos duckdb-engine e sqlalchemy-redshift são os compiladores de serialize_db.sql.render
# (decisão do usuário de 2026-09-21), e duckdb-engine importa o duckdb. O boto3 faz a escrita
# condicional do arquivo de controle no S3 (serialize_db.storage).
dependencies = [
    "boto3==1.43.98",
    "deltalake==1.6.4",
    "duckdb==1.5.5",
    "duckdb-engine==0.17.0",
    "pyarrow==25.0.1",
    "sqlalchemy==2.0.54",
    "sqlalchemy-redshift==1.0.0",
]

[project.scripts]
serialize-db = "serialize_db:main"

[dependency-groups]
# Versões fixadas nas usadas pelos exemplos em plan/ e pela prova de conceito.
dev = [
    "boto3>=1.40",
    "deltalake==1.6.4",
    "duckdb==1.5.5",
    # O substituto local do S3 (tests/emulator.py): o servidor do moto roda sobre o Flask.
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "moto[s3]==5.2.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "pytest>=8.4",
    "redshift-connector>=2.1",
    "sqlalchemy==2.0.54",
    "sqlglot==30.18.0",
]
# A documentação do pacote, publicada em HTML estático.
docs = [
    "pdoc==16.0.0",
]
interactive = [
    "ipykernel>=7.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A migração adiantada e os probes são scripts fora do pacote: as pastas entram no caminho de
# importação, e tests/test_migrate_parquet_to_delta.py e tests/test_probes.py os importam pelo nome.
pythonpath = ["scripts", "probes"]
markers = [
    "local: escreve sob SERIALIZE_DB_TEST_LOCAL_ROOT; pulado sem ela",
    "s3: escreve sob SERIALIZE_DB_TEST_S3_ROOT; pulado sem ela, falha sem acesso",
    "redshift: cria tabelas no esquema SERIALIZE_DB_TEST_REDSHIFT_SCHEMA; pulado sem ela, falha sem conexão",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
