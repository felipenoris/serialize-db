# Os testes do pacote serialize_db: tests/ sem tests/proof_of_concept/, sobre o DuckDB em memória e
# arquivos locais, sem S3 nem Redshift. As provas de conceito, os exemplos e os probes ficam fora.
name: Testes do pacote

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # O índice corporativo de pyproject.toml ([[tool.uv.index]]) só responde na rede corporativa; um
  # arquivo de configuração vazio faz o uv ignorar a seção [tool.uv] e resolver pelo PyPI.
  UV_CONFIG_FILE: ${{ github.workspace }}/.github/uv-ci.toml
  SERIALIZE_DB_TEST_LOCAL_ROOT: ${{ github.workspace }}/.pytest-local-root

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"

      - name: Instalar o pacote e as dependências de teste
        run: uv sync --group dev

      - name: Preparar a raiz local dos testes que gravam arquivos
        run: mkdir -p "$SERIALIZE_DB_TEST_LOCAL_ROOT"

      - name: Rodar os testes do pacote
        run: uv run pytest tests --ignore=tests/proof_of_concept -p no:cacheprovider
